services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osfl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-osfl}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osfl}"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-osfl}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-osfl}
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8010}:8000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
