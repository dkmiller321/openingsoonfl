# Production override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Adds Caddy (automatic HTTPS) in front of the app. Set DOMAIN in .env (e.g. app.openingsoonfl.com).
services:
  app:
    restart: unless-stopped
    environment:
      SCHEDULER_ENABLED: "1"
      TEST_ROUTES: "0"

  postgres:
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
