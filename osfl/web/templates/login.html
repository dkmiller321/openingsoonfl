{% extends "base.html" %}
{% block title %}Log in · OpeningSoon FL{% endblock %}
{% block content %}
<div class="login">
  <h1>OpeningSoon FL</h1>
  <p class="sub">Operator sign in</p>
  {% if error %}<div class="notice error" data-testid="login-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="card">
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" data-testid="login-password" autofocus required>
    </div>
    <button class="btn" data-testid="login-submit" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
