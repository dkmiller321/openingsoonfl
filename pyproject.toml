[project]
name = "osfl"
version = "0.1.0"
description = "OpeningSoon FL: early alerts about new Florida restaurants for vendors."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3,<4",
    "sqlalchemy>=2,<3",
    "alembic>=1,<2",
    "psycopg[binary]>=3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "apscheduler>=3.10,<4",
    "itsdangerous>=2,<3",
    "python-multipart>=0.0.9",
]

[project.scripts]
osfl = "osfl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osfl"]

[tool.pytest.ini_options]
addopts = "--strict-markers -p no:cacheprovider"
markers = [
    "stage0", "stage1", "stage2", "stage3", "stage4", "stage5", "stage6",
    "smoke: live DBPR / Resend tests, manual only",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
